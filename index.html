<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bb tym</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body class="bg-gradient-to-r from-cyan-500 to-blue-500">
    <div class="h-screen relative flex flex-col gap-5 justify-center items-center">
 

        <div class="atropos my-atropos ">
            <!-- scale container (required) -->
            <div class="atropos-scale">
              <!-- rotate container (required) -->
              <div class="atropos-rotate">
                <!-- inner container (required) -->
                <div class="atropos-inner rounded-lg">
                    <img class="absolute inset-0 w-full h-full object-cover" src="./assets/bg.svg" data-atropos-offset="-5">
                    <img class="absolute inset-0 w-full h-full object-cover" src="./assets/stars.png" data-atropos-offset="0" /> 
                    <div class="flex flex-col items-center justify-center h-full p-4 relative z-10">
                        <img id="buggy-happy" class="main-gif hidden mb-4" src="./assets/happy.gif" data-atropos-offset="5" />
                        <img id="buggy-pleading" class="main-gif mb-4" src="./assets/please.gif" data-atropos-offset="5" />
                        <div class="question-text" data-atropos-offset="5">
                            <h1 class="text-2xl font-bold text-white text-center">BB TYM TAYO?</h1>
                        </div>
                    </div>
                </div>
              </div>
            </div>
          </div>

          <div class="answer ">
            <button class="bn54" id="yes-btn"><span class="bn54span">YES</span></button>
            <button class="bn54No mt-2" id="randomButton"><span class="bn54spanNo">NO</span></button>
          </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.js"></script>
    <script>
      const myAtropos = Atropos({
        el: '.my-atropos',
        // rest of parameters
      });
    </script>
    <script src="./script.js"></script>
</body>
</html>
